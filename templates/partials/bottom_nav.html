{% load i18n %}
{% with current=request.resolver_match.url_name %}
<nav class="app-nav pointer-events-none fixed inset-x-0 bottom-0 z-30 px-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]" aria-label="{% translate 'Main' %}">
  <div class="app-bar pointer-events-auto mx-auto flex max-w-md overflow-hidden rounded-2xl shadow-xl ring-1 ring-bar-ink/10">
    <a href="{% url 'home' %}" class="nav-item {% if current == 'home' or current == 'entry' %}nav-item-active{% endif %}" {% if current == 'home' or current == 'entry' %}aria-current="page"{% endif %}>
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      <span>{% translate "Today" %}</span>
    </a>
    <a href="{% url 'me' %}" class="nav-item {% if current == 'dashboard' and person == user %}nav-item-active{% endif %}" {% if current == 'dashboard' and person == user %}aria-current="page"{% endif %}>
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span>{% translate "My Report" %}</span>
    </a>
    <a href="{% url 'ranks' %}" class="nav-item {% if current == 'ranks' %}nav-item-active{% endif %}" {% if current == 'ranks' %}aria-current="page"{% endif %}>
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      <span>{% translate "Ranks" %}</span>
    </a>
    <a href="{% url 'analysis' %}" class="nav-item {% if current == 'analysis' or current == 'sheet' %}nav-item-active{% endif %}" {% if current == 'analysis' %}aria-current="page"{% endif %}>
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
      <span>{% translate "Analysis" %}</span>
    </a>
    <button type="button" data-more-toggle aria-expanded="false" aria-controls="more-sheet" class="nav-item {% if current == 'devotees' or current == 'password_change' or 'manage_' in current %}nav-item-active{% endif %}">
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      <span>{% translate "More" %}</span>
    </button>
  </div>
</nav>
{% endwith %}

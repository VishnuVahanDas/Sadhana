{% load i18n %}
<form method="get" class="card mb-4 space-y-3" data-period-form>
  {% for name, value in keep.items %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endfor %}
  <div>
    <label for="period" class="mb-1 block text-sm font-medium">{% translate "Period" %}</label>
    <select id="period" name="period" class="input" data-period-select>
      {% for key, label in presets %}
        <option value="{{ key }}" {% if key == period.key %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="grid grid-cols-2 gap-3 {% if period.key != 'custom' %}hidden{% endif %}" data-period-custom>
    <div>
      <label for="start" class="mb-1 block text-sm font-medium">{% translate "From" %}</label>
      <input id="start" type="date" name="start" class="input" value="{{ period.start|date:'Y-m-d' }}">
    </div>
    <div>
      <label for="end" class="mb-1 block text-sm font-medium">{% translate "To" %}</label>
      <input id="end" type="date" name="end" class="input" value="{{ period.end|date:'Y-m-d' }}">
    </div>
    <button type="submit" class="btn-primary col-span-2">{% translate "Show" %}</button>
  </div>
  <p class="text-xs text-ink/70">{{ period.start|date:"j M Y" }} – {{ period.end|date:"j M Y" }} · {% blocktranslate count days=period.days %}{{ days }} day{% plural %}{{ days }} days{% endblocktranslate %}</p>
</form>

<div>
  <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-medium">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<div class="mt-1 text-xs text-ink/70">{{ field.help_text|safe }}</div>{% endif %}
  {% for error in field.errors %}<p class="mt-1 text-sm text-maroon">{{ error }}</p>{% endfor %}
</div>

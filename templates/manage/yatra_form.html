{% extends "manage/base.html" %}
{% load i18n %}
{% block manage %}
<h1 class="mb-3 text-xl font-bold text-maroon">{% blocktranslate with name=level %}Edit “{{ name }}”{% endblocktranslate %}</h1>
<form method="post" class="card space-y-4" novalidate>
  {% csrf_token %}
  {% include "partials/form_fields.html" %}
  <button type="submit" class="btn-primary">{% translate "Save" %}</button>
  <a href="{% url 'manage_yatra' %}" class="btn-secondary w-full">{% translate "Cancel" %}</a>
</form>
{% endblock %}

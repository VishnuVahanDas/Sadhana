# Sadhana Report — sr.iskcongorakhpur.com
# Install as /etc/nginx/sites-available/sr.iskcongorakhpur.com and symlink
# into sites-enabled. A new, separate file: no other site's config is edited.
#
# This is the plain-HTTP version. `certbot --nginx -d sr.iskcongorakhpur.com`
# then adds the certificate and the HTTPS redirect to THIS file only.
# Always run `sudo nginx -t` before reloading.

server {
    listen 80;
    listen [::]:80;
    server_name sr.iskcongorakhpur.com;

    client_max_body_size 2m;

    location /static/ {
        alias /home/vishnuvahan/sadhana/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/sadhna/gunicorn.sock;
        proxy_set_header Host $host;
        # Overwrite (not append) so a client cannot fake its address for the
        # audit log or the login rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
